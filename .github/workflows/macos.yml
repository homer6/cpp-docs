# macOS: Apple Clang (each runner's default Xcode), Homebrew GCC and Homebrew
# LLVM, on Apple silicon (macos-15, macos-26) and Intel (macos-15-intel,
# macos-26-intel). Issue #145.
#
# Homebrew LLVM: Apple silicon gets the current release (23 since 2026-10),
# Intel stays on 22. Homebrew builds no LLVM 23 bottle for Intel macOS (only
# arm64 macOS and Linux; checked 2026-11-02, #253), and LLVM's own 23.1.x
# releases have no Intel macOS build, so 23 there would mean compiling LLVM
# from source on every run.
#
# Manual only: started by hand (or by all.yml through workflow_call), with the
# owner's consent for each run. See .github/workflows/README.md.
name: macOS

on:
  workflow_dispatch:
    inputs:
      areas:
        description: "Test areas: a ctest label regex (empty = all), e.g. ^containers$|^ranges$"
        type: string
        default: ""
      tests:
        description: "Build and run the GoogleTest suite"
        type: boolean
        default: true
      snippets:
        description: "Run the snippet checker"
        type: boolean
        default: true
      jobs:
        description: "Jobs to start: a regex searched for in each job name (empty = all). Preview: tools/ci/plan.py --jobs '<regex>'"
        type: string
        default: ""
  workflow_call:
    inputs:
      areas:
        type: string
        default: ""
      tests:
        type: boolean
        default: true
      snippets:
        type: boolean
        default: true
      jobs:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    # Which jobs this run starts (#376): the entries of .github/ci/macos.json
    # whose name matches the `jobs` input (empty: all). A job with no selected
    # entry doesn't start. Preview a pattern with tools/ci/plan.py.
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      macos_on: ${{ steps.plan.outputs.macos_on }}
      homebrew_llvm_asan: ${{ steps.plan.outputs.homebrew_llvm_asan }}
      homebrew_llvm_asan_on: ${{ steps.plan.outputs.homebrew_llvm_asan_on }}
      homebrew_llvm_hardened: ${{ steps.plan.outputs.homebrew_llvm_hardened }}
      homebrew_llvm_hardened_on: ${{ steps.plan.outputs.homebrew_llvm_hardened_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            tools/ci

      - name: Select the jobs
        id: plan
        env:
          JOBS: ${{ inputs.jobs }}
        run: python3 tools/ci/plan.py macos.yml --jobs "$JOBS" --github-output

  macos:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.macos_on == 'true' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: false
    timeout-minutes: 180
    # apple-clang: Xcode's clang++ and the SDK's libc++ (no baseline yet:
    # Apple's libc++ lags upstream, so its first run makes one).
    # homebrew-gcc: `brew install gcc` (newest g++-N), libstdc++.
    # homebrew-llvm: `brew install llvm`, with LLVM's own libc++.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos) }}  # .github/ci/macos.json
    env:
      CPPDOCS_AREAS: ${{ inputs.areas }}
      CPPDOCS_TESTS: ${{ inputs.tests }}
      CPPDOCS_SNIPPETS: ${{ inputs.snippets }}
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (${{ matrix.toolchain }})
        run: tools/ci/macos-toolchain.sh "${{ matrix.toolchain }}"

      - name: Configure, build, test, check snippets
        run: tools/ci/run.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-${{ env.CPPDOCS_PLATFORM || matrix.runner }}-${{ env.CPPDOCS_COMPILER || matrix.toolchain }}
          path: |
            results-*.json
            ci-out/
          if-no-files-found: warn

  homebrew-llvm-asan:
    # Homebrew LLVM with ASan + UBSan on Apple silicon (#263). A job of its own
    # (an include would change the plain homebrew-llvm job). LeakSanitizer
    # isn't supported on macOS, so leaks are checked by the Linux jobs.
    name: macos-26 · homebrew-llvm (ASan + UBSan)
    needs: plan
    if: ${{ needs.plan.outputs.homebrew_llvm_asan_on == 'true' }}
    runs-on: macos-26
    continue-on-error: false
    timeout-minutes: 240
    env:
      CPPDOCS_AREAS: ${{ inputs.areas }}
      CPPDOCS_TESTS: ${{ inputs.tests }}
      CPPDOCS_SNIPPETS: ${{ inputs.snippets }}
      CPPDOCS_SANITIZE: address,undefined
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (homebrew-llvm)
        run: tools/ci/macos-toolchain.sh homebrew-llvm

      - name: Configure, build, test (sanitized)
        run: tools/ci/run.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-${{ env.CPPDOCS_PLATFORM || 'macos-26' }}-${{ env.CPPDOCS_COMPILER || 'homebrew-llvm-asan' }}
          path: |
            results-*.json
            ci-out/
          if-no-files-found: warn

  homebrew-llvm-hardened:
    # Homebrew LLVM hardened (#305): libc++ fast hardening, stack protection,
    # PIE, RelWithDebInfo. A job of its own, like the ASan job above.
    name: macos-26 · homebrew-llvm (hardened)
    needs: plan
    if: ${{ needs.plan.outputs.homebrew_llvm_hardened_on == 'true' }}
    runs-on: macos-26
    continue-on-error: false
    timeout-minutes: 240
    env:
      CPPDOCS_AREAS: ${{ inputs.areas }}
      CPPDOCS_TESTS: ${{ inputs.tests }}
      CPPDOCS_SNIPPETS: ${{ inputs.snippets }}
      CPPDOCS_HARDEN: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (homebrew-llvm)
        run: tools/ci/macos-toolchain.sh homebrew-llvm

      - name: Configure, build, test (hardened)
        run: tools/ci/run.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-${{ env.CPPDOCS_PLATFORM || 'macos-26' }}-${{ env.CPPDOCS_COMPILER || 'homebrew-llvm-hardened' }}
          path: |
            results-*.json
            ci-out/
          if-no-files-found: warn
