# Linux: GCC 13-16 and Clang 18-23 (with libstdc++ and with libc++) on x86_64
# and native arm64. Issues #143 (x86_64) and #144 (arm64).
#
# Where each compiler comes from (checked 2026-11-01):
#   GCC 13-16   the official gcc:N images (Docker Library), pinned by their
#               multi-arch index digest: each has the newest upstream release
#               (13.5, 14.4, 15.3, 16.2) for amd64 and arm64. Noble's archive
#               stops at GCC 14 and the toolchain PPA has only a GCC 16
#               snapshot, so the images are the one source for all four.
#               gcc:13 is Debian bookworm (CMake 3.25.1), 14-16 trixie.
#   Clang 18-23 apt.llvm.org on ubuntu-24.04 (noble has a suite for each
#               version, amd64 and arm64), with clang-N, clang-tools-N and
#               libc++-N-dev. 23 is LLVM's stable branch (checked 2026-11-02:
#               llvm-toolchain-noble-23 ships 23.1.5 branch builds for both).
#   26.04       ubuntu-26.04 / ubuntu-26.04-arm are public preview: GCC 15 and
#               Clang 22 from Ubuntu's own archive (apt.llvm.org has no 18-20
#               for 26.04).
#
# The jobs and their matrix values (the gcc:N digests too) are in
# .github/ci/linux.json (#376). To refresh a digest: docker buildx imagetools
# inspect gcc:N (the "Digest:" line), then update every entry that uses it.
#
# Manual only: started by hand (or by all.yml through workflow_call), with the
# owner's consent for each run. See .github/workflows/README.md.
name: Linux

on:
  workflow_dispatch:
    inputs:
      areas:
        description: "Test areas: a ctest label regex (empty = all), e.g. ^containers$|^ranges$"
        type: string
        default: ""
      tests:
        description: "Build and run the GoogleTest suite"
        type: boolean
        default: true
      snippets:
        description: "Run the snippet checker"
        type: boolean
        default: true
      jobs:
        description: "Jobs to start: a regex searched for in each job name (empty = all). Preview: tools/ci/plan.py --jobs '<regex>'"
        type: string
        default: ""
  workflow_call:
    inputs:
      areas:
        type: string
        default: ""
      tests:
        type: boolean
        default: true
      snippets:
        type: boolean
        default: true
      jobs:
        type: string
        default: ""

permissions:
  contents: read

env:
  CPPDOCS_AREAS: ${{ inputs.areas }}
  CPPDOCS_TESTS: ${{ inputs.tests }}
  CPPDOCS_SNIPPETS: ${{ inputs.snippets }}

jobs:
  plan:
    # Which jobs this run starts (#376): the entries of .github/ci/linux.json
    # whose name matches the `jobs` input (empty: all). A job with no selected
    # entry doesn't start. Preview a pattern with tools/ci/plan.py.
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gcc: ${{ steps.plan.outputs.gcc }}
      gcc_on: ${{ steps.plan.outputs.gcc_on }}
      clang: ${{ steps.plan.outputs.clang }}
      clang_on: ${{ steps.plan.outputs.clang_on }}
      clang_sanitizers: ${{ steps.plan.outputs.clang_sanitizers }}
      clang_sanitizers_on: ${{ steps.plan.outputs.clang_sanitizers_on }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      fuzz_on: ${{ steps.plan.outputs.fuzz_on }}
      clang_tidy: ${{ steps.plan.outputs.clang_tidy }}
      clang_tidy_on: ${{ steps.plan.outputs.clang_tidy_on }}
      ubuntu_26_04: ${{ steps.plan.outputs.ubuntu_26_04 }}
      ubuntu_26_04_on: ${{ steps.plan.outputs.ubuntu_26_04_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            tools/ci

      - name: Select the jobs
        id: plan
        env:
          JOBS: ${{ inputs.jobs }}
        run: python3 tools/ci/plan.py linux.yml --jobs "$JOBS" --github-output

  gcc:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.gcc_on == 'true' }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    continue-on-error: false
    timeout-minutes: 180
    # arm64 (#144): the same images, native on the arm runner.
    # GCC 16 with ASan + UBSan (#263): its own results and page (gcc-16-asan).
    # GCC 16 hardened (#305): its own results and page (gcc-16-hardened).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gcc) }}  # .github/ci/linux.json
    env:
      CPPDOCS_SANITIZE: ${{ matrix.sanitize || '' }}
      CPPDOCS_HARDEN: ${{ matrix.harden || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (cmake, ninja, python3 from Debian)
        run: tools/ci/linux-toolchain.sh gcc-image

      - name: Configure, build, test, check snippets
        run: tools/ci/run.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-${{ env.CPPDOCS_PLATFORM || matrix.runner }}-${{ env.CPPDOCS_COMPILER || format('gcc-{0}', matrix.gcc) }}
          path: |
            results-*.json
            ci-out/
          if-no-files-found: warn

  clang:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.clang_on == 'true' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: false
    timeout-minutes: 180
    # arm64 (#144)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.clang) }}  # .github/ci/linux.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (clang-${{ matrix.clang }} from apt.llvm.org)
        run: tools/ci/linux-toolchain.sh clang-apt-llvm "${{ matrix.clang }}" "${{ matrix.stdlib }}"

      - name: Configure, build, test, check snippets
        run: tools/ci/run.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-${{ env.CPPDOCS_PLATFORM || matrix.runner }}-${{ env.CPPDOCS_COMPILER || format('clang-{0}-{1}', matrix.clang, matrix.stdlib) }}
          path: |
            results-*.json
            ci-out/
          if-no-files-found: warn

  clang-sanitizers:
    # Clang 22 with ASan + UBSan (libc++) and with ThreadSanitizer (libstdc++)
    # (#263). TSan runs against libstdc++ because the packaged libc++ isn't
    # built with TSan: its call_once and unwinder then give false races and
    # crashes (seen with Homebrew LLVM on macOS), while libstdc++'s call_once
    # goes through pthread_once, which TSan intercepts. A job of its own: a
    # matrix include that matched the clang job's combinations would change
    # those jobs instead of adding these. Clang 22 with libc++ hardened (#305)
    # runs here for the same reason.
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.clang_sanitizers_on == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: false
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.clang_sanitizers) }}  # .github/ci/linux.json
    env:
      CPPDOCS_SANITIZE: ${{ matrix.sanitize }}
      CPPDOCS_HARDEN: ${{ matrix.harden || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (clang-22 from apt.llvm.org)
        run: tools/ci/linux-toolchain.sh clang-apt-llvm 22 "${{ matrix.stdlib }}"

      - name: Configure, build, test (sanitized or hardened)
        run: tools/ci/run.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-${{ env.CPPDOCS_PLATFORM || 'ubuntu-24.04' }}-${{ env.CPPDOCS_COMPILER || format('clang-22-{0}-{1}', matrix.stdlib, matrix.harden && 'hardened' || (matrix.sanitize == 'thread' && 'tsan' || 'asan')) }}
          path: |
            results-*.json
            ci-out/
          if-no-files-found: warn

  fuzz:
    # libFuzzer targets for the security pages' parsers (#307): each runs for a
    # time box on a copy of its saved corpus (tools/ci/fuzz.sh). A crash fails
    # the job and its input is uploaded, to be minimized and saved in
    # fuzz/corpus/ as a regression input; the replay test runs that corpus on
    # every platform. Runs when the tests do.
    name: Fuzz (Clang 22 libFuzzer + ASan + UBSan) · ubuntu-24.04
    needs: plan
    if: ${{ inputs.tests && needs.plan.outputs.fuzz_on == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: false
    timeout-minutes: 30
    env:
      CPPDOCS_FUZZ: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (clang-22 from apt.llvm.org)
        run: tools/ci/linux-toolchain.sh clang-apt-llvm 22 libstdcxx

      - name: Build the fuzz targets
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCPPDOCS_FUZZ=ON
          cmake --build build/fuzz --target fuzz_targets

      - name: Fuzz each target (120 s each)
        run: tools/ci/fuzz.sh 120

      - name: Upload failing inputs and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-clang-22-ubuntu-24.04
          path: fuzz-out/
          if-no-files-found: ignore

  clang-tidy:
    # clang-tidy with the repo's profile (.clang-tidy: cppcoreguidelines-*, cert-*,
    # bugprone-*) over the security tests and the fuzz headers they include (#308).
    # Every finding fails the job; an intentional one stays with NOLINT(check): why.
    name: clang-tidy (Clang 22) · ubuntu-24.04
    needs: plan
    if: ${{ inputs.tests && needs.plan.outputs.clang_tidy_on == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: false
    timeout-minutes: 30
    env:
      CPPDOCS_TIDY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (clang-22 and clang-tidy-22 from apt.llvm.org)
        run: tools/ci/linux-toolchain.sh clang-apt-llvm 22 libstdcxx

      - name: Configure (compile_commands.json) and build GoogleTest
        run: |
          cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/tidy --target gtest gtest_main

      - name: clang-tidy
        run: CLANG_TIDY=clang-tidy-22 tools/run_clang_tidy.sh build/tidy

  ubuntu-26-04:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.ubuntu_26_04_on == 'true' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: false
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ubuntu_26_04) }}  # .github/ci/linux.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (${{ matrix.tc.label }})
        run: tools/ci/linux-toolchain.sh "${{ matrix.tc.kind }}" "${{ matrix.tc.ver }}" "${{ matrix.tc.stdlib }}"

      - name: Configure, build, test, check snippets
        run: tools/ci/run.sh

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-${{ env.CPPDOCS_PLATFORM || matrix.runner }}-${{ env.CPPDOCS_COMPILER || matrix.tc.label }}
          path: |
            results-*.json
            ci-out/
          if-no-files-found: warn
