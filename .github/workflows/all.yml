# Entry workflow: runs the platform workflows in one manual run (#150).
#
# Manual only, like every workflow here: workflow_dispatch is the only
# trigger, and a run needs the owner's consent, given in the moment for that
# run. Even "all" is a deliberate, consented run.
#
# Each platform job calls a reusable workflow in this folder (`uses:
# ./.github/workflows/<file>`, which needs `workflow_call` next to
# `workflow_dispatch` in that file) and passes the same inputs. The caller
# jobs are named after the file ("linux.yml") so tools/collect_results.py can
# tell which platforms a run covered from its job names ("linux.yml / <job>").
#
# Afterwards: tools/collect_results.py <run-id> refreshes
# docs/platform-support.md from this run's results-*.json artifacts.
name: All platforms

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          "all", or a comma list of: linux, macos, windows-msvc, windows-gnu,
          freebsd
        type: string
        default: all
      areas:
        description: ctest label regex for the test areas (empty means all)
        type: string
        default: ""
      snippets:
        description: Run the snippet checker
        type: boolean
        default: true
      tests:
        description: Build and run the GoogleTest suite
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - name: Validate the platforms input
        id: plan
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          AREAS: ${{ inputs.areas }}
          SNIPPETS: ${{ inputs.snippets }}
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          known="linux macos windows-msvc windows-gnu freebsd"
          if [[ "$SNIPPETS" != true && "$TESTS" != true ]]; then
            echo "::error::Both snippets and tests are off; nothing to run."
            exit 1
          fi
          list="$(printf '%s' "$PLATFORMS" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          if [[ -z "$list" || "$list" == all ]]; then
            list="${known// /,}"
          fi
          json="["
          IFS=',' read -ra wanted <<< "$list"
          for p in "${wanted[@]}"; do
            [[ -z "$p" ]] && continue
            if [[ " $known " != *" $p "* ]]; then
              echo "::error::Unknown platform '$p'. Use 'all' or a comma list of: $known"
              exit 1
            fi
            json+="\"$p\","
          done
          json="${json%,}]"
          if [[ "$json" == "[]" ]]; then
            echo "::error::No platforms selected."
            exit 1
          fi
          echo "platforms=$json" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| platforms | \`$json\` |"
            echo "| areas | \`${AREAS:-(all)}\` |"
            echo "| snippets | $SNIPPETS |"
            echo "| tests | $TESTS |"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: linux.yml
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.platforms), 'linux')
    uses: ./.github/workflows/linux.yml
    with:
      areas: ${{ inputs.areas }}
      snippets: ${{ inputs.snippets }}
      tests: ${{ inputs.tests }}

  macos:
    name: macos.yml
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.platforms), 'macos')
    uses: ./.github/workflows/macos.yml
    with:
      areas: ${{ inputs.areas }}
      snippets: ${{ inputs.snippets }}
      tests: ${{ inputs.tests }}

  windows-msvc:
    name: windows-msvc.yml
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.platforms), 'windows-msvc')
    uses: ./.github/workflows/windows-msvc.yml
    with:
      areas: ${{ inputs.areas }}
      snippets: ${{ inputs.snippets }}
      tests: ${{ inputs.tests }}

  windows-gnu:
    name: windows-gnu.yml
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.platforms), 'windows-gnu')
    uses: ./.github/workflows/windows-gnu.yml
    with:
      areas: ${{ inputs.areas }}
      snippets: ${{ inputs.snippets }}
      tests: ${{ inputs.tests }}

  freebsd:
    name: freebsd.yml
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.platforms), 'freebsd')
    uses: ./.github/workflows/freebsd.yml
    with:
      areas: ${{ inputs.areas }}
      snippets: ${{ inputs.snippets }}
      tests: ${{ inputs.tests }}

  # One matrix for the whole run in the run's summary page, built by the same
  # collector that writes docs/platform-support.md (that page is refreshed
  # locally, never committed from here).
  summary:
    name: summary
    needs: [plan, linux, macos, windows-msvc, windows-gnu, freebsd]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: results-*
          path: results
      - name: Platform matrix
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p results
          python3 tools/collect_results.py results --summary --run-url "$RUN_URL" \
            --date "$(date -u +%F)" --stdout >> "$GITHUB_STEP_SUMMARY"
